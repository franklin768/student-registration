<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arteka Voice Assistant</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }
      body {
        background: #0a3d62;
        color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
      }
      h1 {
        margin: 20px 0 5px;
        font-size: 1.6em;
      }
      p.sub {
        opacity: 0.8;
        margin-bottom: 30px;
      }
      #micBtn {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        border: none;
        background: #27ae60;
        font-size: 40px;
        cursor: pointer;
        box-shadow: 0 0 20px rgba(39, 174, 96, 0.8);
        transition: transform 0.2s;
      }
      #micBtn:active {
        transform: scale(0.92);
        background: #2ecc71;
      }
      #micBtn.listening {
        background: #e74c3c;
        animation: pulse 1s infinite;
      }
      @keyframes pulse {
        0% {
          box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.7);
        }
        70% {
          box-shadow: 0 0 0 20px rgba(231, 76, 60, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(231, 76, 60, 0);
        }
      }
      .box {
        background: #fff;
        color: #222;
        width: 100%;
        max-width: 500px;
        border-radius: 12px;
        padding: 15px;
        margin-top: 20px;
      }
      .box h3 {
        margin-bottom: 8px;
        color: #0a3d62;
      }
      #userText {
        min-height: 20px;
        margin-bottom: 15px;
      }
      #botText {
        min-height: 40px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h1>Arteka Voice</h1>
    <p class="sub">press the button and talk</p>

    <button id="micBtn" onclick="startListening()">mic</button>
    <p id="status" style="margin-top: 10px">Tap mic to start</p>

    <div class="box">
      <h3>You said</h3>
      <p id="userText">...</p>
      <h3>Assistant</h3>
      <p id="botText">I am listening...</p>
    </div>

    <script>
      const micBtn = document.getElementById("micBtn");
      const status = document.getElementById("status");
      const userText = document.getElementById("userText");
      const botText = document.getElementById("botText");

      const SpeechRecognition =
        window.SpeechRecognition || window.webkitSpeechRecognition;
      const recoggnition = new SpeechRecognition();
      recognition.lang = "en-US";
      recognition.interimResults = false;

      function speak(text) {
        botText.textContent = text;
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "en-US";
        utterance.rate = 1;
        speechSynthesis.speak(utterance);
      }

      function startListening() {
        recognition.start();
        micBtn.classList.add("listening");
        status.textContent = "Listening... speak now";
      }

      recognition.onresult = function (event) {
        const transcript = event.results[0][0].transcript;
        userText.textContent = transcript;
        handleCommand(transcript);
      };

      recognition.onend = function () {
        micBtn.classList.remove("listening");
        status.textContent = "Tap mic to start";
      };

      recognition.onerror = function () {
        speak("Sorry, I did not hear you. Try again.");
      };

      async function handleCommand(text) {
        let lower = text.toLowerCase();

        if (
          lower.includes("hello") ||
          lower.includes("hi") ||
          lower.includes("hey")
        ) {
          speak("Hello! How can I help you today?");
        } else if (lower.includes("your name")) {
          speak("I am Arteka Voice, Franklin Miruka voice assistant project.");
        } else if (lower.includes("time")) {
          speak("The time is " + new Date().toLocaleTimeString());
        } else if (lower.includes("date") || lower.includes("day")) {
          speak("Today is " + new Date().toLocaleDateString());
        } else if (
          lower.includes("who made you") ||
          lower.includes("who created you")
        ) {
          speak("I was created by Franklin Miruka.");
        } else if (lower.includes("open youtube")) {
          speak("Opening Youtube");
          window.open("https://youtube.com", "_blank");
        } else if (lower.includes("Open google")) {
          speak("Opening Google");
          window.open("https://google.com", "_blank");
        } else if (lower.includes("calculate") || lower.match(/what is \\d/)) {
          try {
            let expression = lower
              .replace("what is", "")
              .replace("calculate", "");
            let result = Function("return " + expression)();
            speak("The answer is" + result);
          } catch (e) {
            speak("Sorry, I could not calculate that.");
          }
        } else if (
          lower.includes("search") ||
          lower.includes("who is") ||
          lower.includes("what is")
        ) {
          let query = lower
            .replace("search", "")
            .replace("who is", "")
            .replace("what is", "")
            .trim();
          speak("Let me search for " + query);
          try {
            let res = await fetch(
              "https://en.wikipedia.org/api/rest_v1/page/summary/" +
                encodeURIComponent(query),
            );
            let data = await res.json();
            if (data.extract) {
              speak(data.extract.substring(0, 200));
            } else {
              speak("I could not find information on " + query);
            }
          } catch (e) {
            speak("Search failed. Check your internet.");
          }
        } else {
          speak("I heard: " + text + ". I am still Learning to answer that.");
        }
      }
    </script>
  </body>
</html>
